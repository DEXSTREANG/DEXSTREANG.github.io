<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="pv"></div>
<script>
var R_ = [604, 704, 706].map(function (x) { return String(x * 2); });


var ROOM_IDS = [R_[0], R_[1], R_[2], '와우산로'];
var SMALL_ROOMS = [R_[0], R_[1], R_[2]];


var AGODA_PROPERTY = { '49033786': R_[2], '59313992': R_[0], '62441152': R_[1], '81848742': '와우산로', '99046258': R_[0] };
var BOOKING_HOTEL = { '12680337': 'TIGER', '15459010': '와우산로', '16440994': '와우산로' };
var AIRBNB_LISTING = { '1561437699325566953': '와우산로' };


function pad2(n) { n = Number(n); return (n < 10 ? '0' : '') + n; }
function parseYmd(s) { var p = String(s).split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function toYmd(d) { return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function makeYmd(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
function addDays(s, n) { var d = parseYmd(s); d.setUTCDate(d.getUTCDate() + n); return toYmd(d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function wdName(s) { return '일월화수목금토'.charAt(parseYmd(s).getUTCDay()); }
function mdLabel(s) { var p = String(s).split('-'); return (+p[1]) + '월 ' + (+p[2]) + '일'; }
function mdwLabel(s) { return mdLabel(s) + '(' + wdName(s) + ')'; }
function isYmd(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) return false;
  return toYmd(parseYmd(s)) === s;
}
function nightsOf(r) { return diffDays(r.checkin, r.checkout); }


function isActive(r) {
  return r.status === '확정' && isYmd(r.checkin) && isYmd(r.checkout) && r.checkout > r.checkin && Number(r.guests) > 0 && ROOM_IDS.indexOf(r.room) >= 0;
}
function activeRes(all, room) {
  return all.filter(function (r) { return r.room === room && isActive(r); })
    .sort(function (a, b) { return a.checkin < b.checkin ? -1 : (a.checkin > b.checkin ? 1 : 0); });
}
function nextResAfter(rs, date) {
  for (var i = 0; i < rs.length; i++) if (rs[i].checkin > date) return rs[i];
  return null;
}

function findConflicts(all) {
  var out = [];
  ROOM_IDS.forEach(function (room) {
    var rs = activeRes(all, room);
    for (var i = 0; i < rs.length; i++) for (var j = i + 1; j < rs.length; j++) {
      if (rs[i].checkin < rs[j].checkout && rs[j].checkin < rs[i].checkout) out.push({ room: room, a: rs[i], b: rs[j] });
    }
  });
  return out;
}


var CUTOFF_MIN = 900;   
function cutoffPassed(date, now) {
  var d1 = addDays(date, -1);
  return now.today > d1 || (now.today === d1 && now.nowMin >= CUTOFF_MIN);
}

var SMALL_CAP = { '와우산로': 30 };
var SMALL_CAP_DEFAULT = 25;

function smallTowels(room, g, n) {
  var cap = SMALL_CAP[room] || SMALL_CAP_DEFAULT;
  if (!(g > 0) || !(n > 0)) return g * n;
  var per = n === 1 ? 2 : n;
  if (g * per <= cap) return g * per;
  return g * Math.max(1, Math.min(per, Math.floor(cap / g)));
}
function bigTowels(g, n) { return n === 1 ? 0 : g; }
function computeCell(date, rs, now) {
  var co = null, ci = null, stay = false;
  for (var i = 0; i < rs.length; i++) {
    var r = rs[i];
    if (r.checkout === date) co = r;
    if (r.checkin === date) ci = r;
    if (r.checkin < date && date < r.checkout) stay = true;
  }
  var n, g;
  if (ci && (co || (!stay && !cutoffPassed(date, now)))) { n = nightsOf(ci); g = Number(ci.guests); return { k: 'clean', g: g, n: n, small: smallTowels(ci.room, g, n), big: bigTowels(g, n) }; }
  if (ci || stay) return { k: 'stay' };
  if (co) {
    var nx = nextResAfter(rs, date), c = { k: 'nosame' };
    if (nx) { n = nightsOf(nx); g = Number(nx.guests); c.next = { date: nx.checkin, g: g, n: n }; c.small = smallTowels(nx.room, g, n); c.big = bigTowels(g, n); }
    return c;
  }
  return { k: 'empty' };
}


function notesFor(notes, room, date) {
  return (notes || []).filter(function (n) { return n.room === room && n.date === date && n.text; })
    .map(function (n) { return n.text; });
}


function buildBoard(all, notes, fromDate, toDate, now) {
  var byRoom = {};
  ROOM_IDS.forEach(function (room) { byRoom[room] = activeRes(all, room); });
  var days = [];
  for (var d = fromDate; d <= toDate; d = addDays(d, 1)) {
    var cells = {};
    ROOM_IDS.forEach(function (room) {
      var c = computeCell(d, byRoom[room], now);
      var ns = notesFor(notes, room, d);
      if (ns.length) c.notes = ns;
      cells[room] = c;
    });
    days.push({ date: d, wd: wdName(d), cells: cells });
  }
  return days;
}
function isCleaning(k) { return k === 'clean' || k === 'nosame'; }


function dateLine(date, cell) {
  return cell.k === 'nosame' ? mdLabel(date) + ' - 당일예약 x' : mdLabel(date) + '(' + cell.n + '박)';
}
function blockLines(room, date, cell, roomInfo) {
  var lines = ['🔑 ' + roomInfo.name + ' 🔑  PW : ' + (roomInfo.pw || ''), ''];
  lines.push(dateLine(date, cell));
  if (cell.k === 'nosame') {
    lines.push('[작은수건]' + (cell.small != null ? ' ' + cell.small : ''));
    lines.push('[큰 수건]' + (cell.big != null ? ' ' + cell.big : ''));
  } else {
    lines.push('게스트 ' + cell.g + '명');
    lines.push('[작은수건] ' + cell.small);
    lines.push('[큰 수건] ' + cell.big);
  }
  (cell.notes || []).forEach(function (t) { lines.push('* ' + t); });
  return lines;
}
function copyText(date, cells, roomInfos) {
  var head = '[' + mdLabel(date) + ' 청소일정]';
  var blocks = [];
  ROOM_IDS.forEach(function (room) {
    var c = cells[room];
    if (!c || !isCleaning(c.k)) return;
    blocks.push(blockLines(room, date, c, roomInfos[room]).join('\n'));
  });
  if (!blocks.length) return head + '\n\n청소 없음';
  return head + '\n\n' + blocks.join('\n\n\n');
}


function cellSig(c) {
  if (!isCleaning(c.k)) return 'none';
  return [c.k, c.g || '', c.n || '', c.small == null ? '' : c.small, c.big == null ? '' : c.big, (c.notes || []).join('¶')].join('|');
}
var ICON = { night: '🌙', guest: '👥', note: '📌', key: '🔑' };
function describeCell(c) {

function copyOut(text) {

    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  if (ok) { toast('복사했어요'); return; }
  var manual = function () { S.sheet = { t: 'copy', text: text }; renderSheet(); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); }, manual); return; }
  } catch (e) {}
  manual();
}

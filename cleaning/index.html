function pad2(n) { n = Number(n); return (n < 10 ? '0' : '') + n; }

function copyOut(text) {
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  if (ok) { toast('복사했어요'); return; }
  var manual = function () { S.sheet = { t: 'copy', text: text }; renderSheet(); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); }, manual); return; }
  } catch (e) {}
  manual();
}
